syntax = "proto3";

package agenticstream.runtime.v1;

option go_package = "github.com/ghassan-ai-projects/agentic-stream/proto/agenticstream/runtime/v1;runtimev1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Worker-originated events are proposals and telemetry. The runtime remains
// authoritative for budget consumption, Decision validation, acceptance or
// rejection, and durable terminal state.

service EpisodeWorker {
  // Verifies protocol compatibility and supported optional features.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // Executes one immutable, bounded episode. The final event must be Terminal.
  // Cancellation of the RPC is the primary cancellation mechanism.
  rpc Execute(EpisodeRequest) returns (stream EpisodeEvent);
}

// Hosted by the Go runtime. A worker may call only the tools encoded in its
// short-lived capability token.
service EvidenceTools {
  rpc Call(EvidenceToolCall) returns (EvidenceToolResult);
}

message HandshakeRequest {
  string protocol_version = 1;
  string contract_version = 2;
  string worker_id = 3;
  bool non_interactive = 4;
  bool shadow_capable = 5;
  bool counterfactual_capable = 6;
  bool emits_complete_replay_ledger = 7;
  repeated EpisodeKind supports_kinds = 8;
  string runtime_instance_id = 9;
  repeated string requested_features = 10;
}

message HandshakeResponse {
  string protocol_version = 1;
  string contract_version = 2;
  string worker_name = 3;
  string worker_version = 4;
  repeated string supported_features = 5;
  uint64 max_request_bytes = 6;
  uint64 max_event_bytes = 7;
}

message EpisodeRequest {
  string protocol_version = 1;
  string episode_id = 2;
  string trigger_id = 3;
  string tenant_id = 4;
  string situation_id = 5;
  uint64 situation_version = 6;

  // Canonical JSON documents validated by the core before dispatch.
  bytes snapshot_json = 10;
  bytes snapshot_sha256 = 11;
  bytes decision_schema_json = 12;
  bytes decision_schema_sha256 = 13;
  bytes tool_catalog_json = 14;
  bytes tool_catalog_sha256 = 15;
  bytes spec_sha256 = 16;

  // P0B/§5: the versioned diagnosis vocabulary the compiler binds. Canonical
  // bytes plus a domain-separated digest the worker and runtime verify
  // independently before a model call.
  bytes diagnosis_catalog_json = 17;
  bytes diagnosis_catalog_sha256 = 18;

  string objective = 20;
  string executor_name = 21;
  string executor_version = 22;
  string model_policy = 23;
  string prompt_version = 24;
  // P0B/§2.2/§4.4: the prompt BODY, previously absent from the wire, so the
  // worker can assemble the canonical frame instead of a version string alone.
  string prompt = 25;

  EpisodeBudget budget = 30;
  google.protobuf.Timestamp deadline = 31;
  string supersession_key = 32;
  string traceparent = 33;
  string tracestate = 34;

  // The endpoint is normally a Unix domain socket. The token is opaque,
  // short-lived, and must never be logged or persisted by the worker.
  string evidence_tools_endpoint = 40;
  bytes capability_token = 41;

  EpisodeKind kind = 50;
  EpisodeLane lane = 51;
  RiskClass risk_ceiling = 52;
  repeated string allowed_intent_types = 53;
  string cancellation_key = 54;
  string attempt_id = 55;
  uint64 fence = 56;
  EvidenceTimeRange evidence_time_range = 57;
  Reconsideration reconsideration = 58;
  bytes prompt_sha256 = 59;
  bytes objective_sha256 = 60;
  optional double watch_confidence_floor = 61;
  // P0B/§4.1/§8.2: the authority axis, durable and independent of executor_name.
  // ACTIVE bears action authority; SHADOW is persisted and scored but the
  // runtime independently prevents it from entering the governor.
  DispatchPolicy dispatch_policy = 62;

  // P4/§B9-B10: the spec-bound INTENT catalog — the domain's action
  // vocabulary with declared risks, parameter schemas, presets, and
  // model-writable fields. Canonical bytes plus a domain-separated digest the
  // worker and runtime verify independently before a model call.
  bytes intent_catalog_json = 63;
  bytes intent_catalog_sha256 = 64;

  // P5/§B6-B9: the ordered skill REFS the episode may render into the frame —
  // [{name, tree_sha256}], digest-pinned. The worker resolves each skill's
  // text ONLY from the operator-approved directory and requires the tree
  // digest to match; a mismatch fails before any model call.
  bytes skill_refs_json = 65;
}

enum EpisodeKind {
  EPISODE_KIND_UNSPECIFIED = 0;
  EPISODE_KIND_DIAGNOSE = 1;
  EPISODE_KIND_RECONSIDER = 2;
}

enum EpisodeLane {
  EPISODE_LANE_UNSPECIFIED = 0;
  EPISODE_LANE_FAST = 1;
  EPISODE_LANE_DEEP = 2;
  EPISODE_LANE_BATCH = 3;
}

enum DispatchPolicy {
  DISPATCH_POLICY_UNSPECIFIED = 0;
  DISPATCH_POLICY_ACTIVE = 1;
  DISPATCH_POLICY_SHADOW = 2;
}

enum RiskClass {
  RISK_CLASS_UNSPECIFIED = 0;
  RISK_CLASS_R0 = 1;
  RISK_CLASS_R1 = 2;
  RISK_CLASS_R2 = 3;
  RISK_CLASS_R3 = 4;
  RISK_CLASS_R4 = 5;
}

message EvidenceTimeRange {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp until = 2;
}

message Reconsideration {
  bytes prior_decision_json = 1;
  repeated bytes executed_command_json = 2;
  repeated bytes observed_outcome_json = 3;
  bytes correction_json = 4;
}

message EpisodeBudget {
  google.protobuf.Duration wall_time = 1;
  uint32 max_model_calls = 2;
  uint64 max_input_tokens = 3;
  uint64 max_output_tokens = 4;
  uint32 max_tool_calls = 5;
  uint64 max_tool_result_bytes = 6;
  uint64 max_total_tool_result_bytes = 7;
  uint32 max_provider_retries = 8;
  uint64 max_cost_microunits = 9;
}

message EpisodeEvent {
  string episode_id = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string attempt_id = 4;
  uint64 fence = 5;

  oneof payload {
    EpisodeStarted started = 10;
    ModelStarted model_started = 11;
    ModelDelta model_delta = 12;
    ModelCompleted model_completed = 13;
    ToolLifecycle tool = 14;
    ToolProgress tool_progress = 20;
    BudgetUpdated budget = 15;
    DecisionProposed decision = 16;
    Diagnostic diagnostic = 17;
    Terminal terminal = 18;
    EpisodeCancelling cancelling = 19;
  }
}

message EpisodeStarted {
  string worker_name = 1;
  string worker_version = 2;
  string model_provider = 3;
  string model_id = 4;
}

message ModelStarted {
  uint32 ordinal = 1;
  string provider = 2;
  string model_id = 3;
  bytes request_sha256 = 4;
}

message ModelDelta {
  uint32 model_ordinal = 1;
  DeltaLane lane = 2;
  string text = 3;
}

enum DeltaLane {
  DELTA_LANE_UNSPECIFIED = 0;
  DELTA_LANE_ASSISTANT = 1;
  DELTA_LANE_COMMENTARY = 2;
}

message ModelCompleted {
  uint32 ordinal = 1;
  string finish_reason = 2;
  Usage usage = 3;
  bytes response_sha256 = 4;
}

message ToolLifecycle {
  string call_id = 1;
  string tool_name = 2;
  ToolState state = 3;
  bytes arguments_sha256 = 4;
  bytes result_sha256 = 5;
  bool is_error = 6;
  bool execution_started = 7;
  string error_code = 8;
}

message ToolProgress {
  string call_id = 1;
  uint64 bytes_read = 2;
  uint64 rows_read = 3;
}

enum ToolState {
  TOOL_STATE_UNSPECIFIED = 0;
  TOOL_STATE_REQUESTED = 1;
  TOOL_STATE_STARTED = 2;
  TOOL_STATE_COMPLETED = 3;
  TOOL_STATE_BLOCKED = 4;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cached_input_tokens = 3;
  uint64 reasoning_tokens = 4;
  uint64 cost_microunits = 5;
}

message BudgetUpdated {
  EpisodeBudget remaining = 1;
  Usage cumulative_usage = 2;
  uint32 model_calls_used = 3;
  uint32 tool_calls_used = 4;
  uint64 tool_result_bytes_used = 5;
  uint32 provider_retries_used = 6;
}

message DecisionProposed {
  bytes decision_json = 1;
  bytes decision_sha256 = 2;
  string episode_id = 3;
  string attempt_id = 4;
  uint64 fence = 5;
}

message EpisodeCancelling {
  string reason_code = 1;
  google.protobuf.Timestamp deadline = 2;
}

message Diagnostic {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string diagnostic_ref = 4;
}

message Terminal {
  TerminalStatus status = 1;
  string reason_code = 2;
  string diagnostic_ref = 3;
  Usage usage = 4;
  ArtifactManifest artifact_manifest = 5;
}

enum TerminalStatus {
  TERMINAL_STATUS_UNSPECIFIED = 0;
  TERMINAL_STATUS_PRODUCED = 1;
  TERMINAL_STATUS_DECLINED = 2;
  TERMINAL_STATUS_CANCELLED = 3;
  TERMINAL_STATUS_FAILED = 4;
  TERMINAL_STATUS_TIMED_OUT = 5;
  TERMINAL_STATUS_BUDGET_EXHAUSTED = 6;
}

message ArtifactManifest {
  bytes prompt_sha256 = 1;
  bytes skill_set_sha256 = 2;
  bytes tool_catalog_sha256 = 3;
  string model_policy = 4;
  string contract_version = 5;
  repeated bytes memory_record_sha256 = 6;
}

message EvidenceToolCall {
  string protocol_version = 1;
  string episode_id = 2;
  string call_id = 3;
  string tool_name = 4;
  bytes arguments_json = 5;
  bytes capability_token = 6;
  google.protobuf.Timestamp deadline = 7;
  string attempt_id = 8;
  uint64 fence = 9;
  string traceparent = 10;
  string tracestate = 11;
  string tenant_id = 12;
  string situation_id = 13;
  string entity_id = 14;
  uint64 max_rows = 15;
  uint64 max_bytes = 16;
  google.protobuf.Timestamp time_from = 17;
  google.protobuf.Timestamp time_until = 18;
  uint64 situation_version = 19;
}

message EvidenceToolResult {
  string episode_id = 1;
  string call_id = 2;
  bool is_error = 3;
  string error_code = 4;
  bytes result_json = 5;
  bytes result_sha256 = 6;
  ArtifactRef artifact = 7;
  bool truncated = 8;
  string attempt_id = 9;
  uint64 fence = 10;
  string traceparent = 11;
  string tracestate = 12;
  uint64 row_count = 13;
  uint64 result_bytes = 14;
}

message ArtifactRef {
  string id = 1;
  string media_type = 2;
  uint64 size_bytes = 3;
  bytes sha256 = 4;
}
