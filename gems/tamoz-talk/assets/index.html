<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Talk with Tamoz</title>
  <link rel="stylesheet" href="/talk.css">
  <script type="module" src="/talk.js"></script>
</head>
<body data-state="idle">
  <div id="start" class="start">
    <div class="start-body" role="dialog" aria-modal="true" aria-labelledby="start-title">
      <h1 id="start-title">Talk with Tamoz</h1>
      <p id="start-note">Tamoz will use your microphone and speak replies.</p>
      <button id="start-button" class="filled" type="button">Start talking</button>
      <button id="text-only" class="text" type="button">Type instead</button>
    </div>
  </div>

  <header id="header">
    <span class="title">Tamoz</span>
    <span id="connection" class="dot" role="img" title="Connecting" aria-label="Connecting"></span>
    <button id="settings-button" class="icon" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
    </button>
  </header>

  <section id="settings" hidden>
    <label class="row">Microphone
      <select id="mode">
        <option value="hands-free">Hands-free</option>
        <option value="push-to-talk">Push to talk</option>
        <option value="muted">Off</option>
      </select>
    </label>
    <label class="row">Pause before sending
      <select id="hangover">
        <option value="800">0.8 s</option>
        <option value="1200" selected>1.2 s</option>
        <option value="1600">1.6 s</option>
        <option value="2000">2 s</option>
      </select>
    </label>
    <label class="row">Speak replies <input id="speech" type="checkbox" checked></label>
    <label class="row" id="headphones-row">Headphones (talk over replies) <input id="headphones" type="checkbox"></label>
    <button id="status" class="tonal wide" type="button">Ask Tamoz for status</button>
  </section>

  <main id="conversation" aria-live="polite" aria-relevant="additions"></main>

  <div id="toast" class="snackbar" role="status" aria-live="polite" hidden></div>

  <footer id="footer">
    <div class="status-row">
      <div id="sending" class="sending" hidden>
        <span>Sending…</span>
        <button id="send-now" class="text" type="button">Send now</button>
        <button id="discard" class="text" type="button">Discard</button>
      </div>
      <div id="hint" class="hint" role="status" aria-live="polite" hidden></div>
      <div id="state" class="state" role="status" aria-live="polite">
        <span><span id="state-label">Not started</span><span id="state-detail" aria-hidden="true"></span></span>
        <button id="stop" class="tonal" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/></svg>Stop
        </button>
      </div>
    </div>
    <div class="input-row">
      <form id="compose" class="composer" autocomplete="off">
        <label class="visually-hidden" for="text">Message</label>
        <textarea id="text" rows="1" placeholder="Message Tamoz" maxlength="2000"></textarea>
        <button class="icon send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
        </button>
      </form>
      <button id="talk" class="mic" type="button" aria-label="Talk" title="Talk" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23A6.9 6.9 0 0 0 19 11zm-4.02.17L9 5.18V5a3 3 0 0 1 6 0v6l-.02.17zM4.27 3 3 4.27l6 6V11a3 3 0 0 0 4.23 2.74l1.66 1.66A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a6.9 6.9 0 0 0 2.89-1.06L19.73 21 21 19.73 4.27 3z"/></svg>
      </button>
    </div>
  </footer>
  <audio id="player" preload="none"></audio>
</body>
</html>
